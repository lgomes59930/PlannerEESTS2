</style></head><body><nav id="nav"></nav><div class="wrap" id="app"></div><div id="pr"></div><script>

const b64d=t=>new TextDecoder().decode(Uint8Array.from(atob(t.replace(/\s/g,'')),c=>c.charCodeAt(0)));

const badge=()=>{let b=document.getElementById('syn');if(!b){b=document.createElement('button');b.id='syn';b.className='g noprint';b.style.cssText='position:fixed;right:10px;bottom:10px;z-index:50;font-size:12px;padding:6px 10px;border-radius:20px';b.onclick=cfgGH;document.body.appendChild(b)}b.textContent={off:'☁️ Configurer la synchro',ok:'☁️ Synchronisé',wait:'⏳ Enregistrement…',err:'⚠️ Hors ligne · cliquer',auth:'🔑 Accès refusé · cliquer'}[SYN];b.title=CFG.repo||''};
const gh=(m,b)=>fetch('https://api.github.com/repos/'+CFG.repo+'/contents/planner.json',{method:m,cache:'no-cache',headers:Object.assign({Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json'},b?{'Content-Type':'application/json'}:{}),body:b?J(b):undefined});
async function getRemote(){const r=await gh('GET');if(r.status===404)return{status:404};if(!r.ok)return{status:r.status};const j=await r.json();if(j.encoding!=='base64'||(j.size>0&&!j.content))throw 'big';const t=b64d(j.content);return{status:200,sha:j.sha,data:t.trim()?JSON.parse(t):{}}}
/* fusion à 3 voies, élément par élément (identifiant) : conserve les ajouts et modifications des deux côtés */
const hasId=a=>Array.isArray(a)&&a.every(x=>x&&typeof x==='object'&&x.id!=null);

if((Array.isArray(L)||Array.isArray(R))&&hasId(L||[])&&hasId(R||[])){const bm=new Map((hasId(B)?B:[]).map(x=>[x.id,x])),lm=new Map((L||[]).map(x=>[x.id,x])),rm=new Map((R||[]).map(x=>[x.id,x])),out=[];

for(const id of ids){const a=lm.get(id),c=rm.get(id),d=bm.get(id);
if(a&&c)out.push(J(a)===J(c)?a:(d&&J(a)===J(d)?c:a));
else if(a){if(!d||J(a)!==J(d))out.push(a)}
else if(c){if(!d||J(c)!==J(d))out.push(c)}}
o[k]=out}else o[k]=(J(L)!==J(B))?L:R}return o}
const adopt=(d,s2)=>{S=Object.assign(DEFS(),d);sha=s2;base=JSON.parse(J(d));dirty=false;lsave();lst();render()};
async function cfgGH(){const r=prompt('Dépôt GitHub des données (format compte/dépôt, ex. marie/planner-data) :',CFG.repo||'');if(r===null)return;const t=prompt("Jeton d'accès GitHub (commence par github_pat_) :",CFG.token||'');if(t===null)return;

try{for(let i=0;i<4;i++){const snap=ver,body=J(S);const r=await gh('PUT',Object.assign({message:'maj planner',content:b64e(body)},sha?{sha}:{}));

catch(e){SYN=(e===401||e===403)?'auth':'err'}

if(g.status===401||g.status===403){SYN='auth';badge();return}

const empty=!Object.keys(g.data).length;

else if(first&&S.track&&J(g.data)!==J(S)){if(confirm('Le dépôt contient déjà des données.\n\nOK = charger celles du dépôt\nAnnuler = fusionner avec mes données de ce navigateur')){adopt(g.data,g.sha)}else{S=mergeS({},S,g.data);sha=g.sha;base=g.data;lsave();render();push()}}

}catch(e){SYN='err'}badge()}

/* ===== FIN SYNCHRO ===== */

const bls=()=>BL[S.track]||[];
const pr=r=>r.s==='val'?100:r.steps.length?Math.round(r.steps.filter(x=>x.ok).length/r.steps.length*100):0;

const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;

const go=(v,b)=>{V=v;if(b)B=b;render();scrollTo(0,0)};
BL.ME=[['BC1','Contribuer à l\'accompagnement socioéducatif dans une logique de parcours'],['BC2','Contribuer au projet éducatif spécialisé dans une visée inclusive'],['BC3','S\'inscrire dans un travail d\'équipe et partenarial pour assurer la continuité des accompagnements dans une logique de parcours']];

function mkY(){const n=S.track=='ME'?2:3,p=S.track=='ME'?'ME':'ES';S.yrs=[];for(let i=1;i<=n;i++)S.yrs.push({id:uid(),l:p+i})}
function askTrack(){const m=document.createElement('div');m.className='mod';m.innerHTML=`<form class="card" style="max-width:440px"><h3>🔄 Changer de parcours</h3><p class="mut">Réorientation : vos rendus, stages, événements et notes sont conservés.</p><label>Quelle promotion voulez-vous rejoindre ?<select name="t"><option value="ME">Moniteur Éducateur (BC1 à BC3)</option><option value="ES">Éducateur Spécialisé · réforme 2026 (BC1 à BC4)</option><option value="ESd">Éducateur Spécialisé · ancien référentiel (DC1 à DC4)</option></select></label><label>Dans quelle année ?<select name="k"></select></label><p class="mut">Un rendu rattaché à un bloc qui n'existe pas dans la nouvelle promotion (par ex. BC4 vers ME) reste enregistré mais ne s'affiche plus.</p><div class="row"><button class="b">Valider</button><button type="button" class="g" id="no">Annuler</button></div></form>`;const t=m.querySelector('[name=t]'),k=m.querySelector('[name=k]'),fill=()=>{k.innerHTML=Array.from({length:t.value=='ME'?2:3},(_,i)=>`<option value="${i+1}">${t.value=='ME'?'ME':'ES'}${i+1}</option>`).join('')};t.value=S.track;t.onchange=fill;fill();m.querySelector('#no').onclick=()=>m.remove();m.querySelector('form').onsubmit=e=>{e.preventDefault();chgTrack(t.value,+k.value);m.remove()};document.body.append(m)}

const SF=[['nom','Structure'],['tuteur','Tuteur'],['adresse','Adresse'],['tel','Téléphone'],['email','Email','email'],['debut','Début','date'],['fin','Fin','date'],...ECH.map((t,i)=>['d'+i,t+' (date)','date'])];
const addSt=id=>{const s=id?S.st.find(x=>x.id==id):null,v=s?{...s,...Object.fromEntries(s.ech.map((e,i)=>['d'+i,e.d]))}:{};form(s?'Modifier le stage':'Ajouter un stage',SF,v,o=>{const ech=ECH.map((t,i)=>({t,d:o['d'+i],ok:s?s.ech[i].ok:false}));if(s)Object.assign(s,o,{ech});else S.st.push({id:uid(),...o,ech});sv()})};
const tgE=(id,i)=>{const e=S.st.find(x=>x.id==id).ech[i];e.ok=!e.ok;sv()};
const delSt=id=>{S.st=S.st.filter(x=>x.id!=id);sv()};
const vStg=()=>`<div class="row sp"><h2>Parcours de stage</h2><button class="b" onclick="addSt()">➕ Ajouter un stage</button></div>${S.st.length?S.st.map(s=>`<div class="card"><div class="row sp"><b>${E(s.nom)}</b><span class="tag">${fd(s.debut)} → ${fd(s.fin)}</span></div><div class="mut">Tuteur : ${E(s.tuteur)||'—'} · ${E(s.tel)} · ${E(s.email)}<br>${E(s.adresse)}</div>${s.ech.map((e,i)=>`<div class="st${e.ok?' ok':''}"><input type="checkbox" ${e.ok?'checked':''} onchange="tgE('${s.id}',${i})"><span style="flex:1">${e.t}</span><span class="mut">${fd(e.d)}</span></div>`).join('')}<div class="row"><button class="g" onclick="addSt('${s.id}')">Modifier</button><button class="g" onclick="delSt('${s.id}')">Supprimer</button></div></div>`).join(''):'<p class="mut">Aucun stage. Ajoutez-en un pour voir ses échéances dans le calendrier.</p>'}`;
/* bibliothèque */
const LF=()=>[['bloc','Bloc',bls().map(x=>[x[0],x[0]])],['nom','Nom de l\'auteur'],['prenom','Prénom'],['titre','Titre'],['annee','Année'],['editeur','Éditeur'],['cit','Citation','area'],['note','Note personnelle','area']];
const apa=l=>`${l.nom}${l.prenom?', '+l.prenom[0].toUpperCase()+'.':''} (${l.annee||'s.d.'}). ${l.titre}.${l.editeur?' '+l.editeur+'.':''}`;
const addL=()=>form('Ajouter une référence',LF(),{bloc:B||bls()[0][0]},o=>{S.lib.push({id:uid(),...o});sv()});
const delL=id=>{S.lib=S.lib.filter(x=>x.id!=id);sv()};
const vLib=()=>`<div class="row sp"><h2>Bibliothèque</h2><button class="b" onclick="addL()">➕ Ajouter une référence</button></div>${bls().map(x=>{const a=S.lib.filter(l=>l.bloc===x[0]);return `<div class="card"><b>${x[0]}</b> <span class="mut">${x[1]}</span>${a.length?a.map(l=>`<div class="al"><b>${E(apa(l))}</b>${l.cit?`<div class="mut">« ${E(l.cit)} »</div>`:''}${l.note?`<div class="mut">📌 ${E(l.note)}</div>`:''}<button class="g" onclick="delL('${l.id}')">Supprimer</button></div>`).join(''):'<p class="mut">Aucune référence.</p>'}</div>`}).join('')}`;
/* journal */
const addJ=()=>form('Nouvelle note de journal',[['d','Date','date'],['titre','Titre'],['sit','Situation professionnelle rencontrée','area'],['app','Ce que j\'ai appris','area'],['diff','Difficultés rencontrées','area'],['ana','Analyse réflexive et pistes d\'amélioration','area']],{d:T},o=>{S.j.push({id:uid(),...o});sv()});
const delJ=id=>{S.j=S.j.filter(x=>x.id!=id);sv()};
const jl=()=>S.j.filter(j=>JSON.stringify(j).toLowerCase().includes(QL.toLowerCase())).sort((a,b)=>a.d<b.d?1:-1).map(j=>`<div class="card"><div class="row sp"><b>${E(j.titre)}</b><span class="tag">${fd(j.d)}</span></div>${[['Situation',j.sit],['Appris',j.app],['Difficultés',j.diff],['Analyse',j.ana]].map(x=>x[1]?`<p><b>${x[0]} :</b> ${E(x[1])}</p>`:'').join('')}<button class="g" onclick="delJ('${j.id}')">Supprimer</button></div>`).join('')||'<p class="mut">Aucune note trouvée.</p>';
const vJr=()=>`<div class="row sp"><h2>Journal de formation</h2><button class="b" onclick="addJ()">➕ Nouvelle note</button></div><input placeholder="Rechercher par mot-clé" value="${E(QL)}" oninput="QL=this.value;document.getElementById('jl').innerHTML=jl()" style="margin-bottom:12px"><div id="jl">${jl()}</div>`;
/* diplôme + export */
const vDip=()=>{const b=bls(),n=b.filter(x=>bv(x[0])).length;return `<div class="card hero"><h2>Certification</h2><div>${n} bloc(s) validé(s) sur ${b.length}</div></div><div class="grid">${b.map(x=>`<div class="card"><div class="row sp"><b>${x[0]}</b><span style="font-size:22px">${bv(x[0])?'✅':'⏳'}</span></div><div class="mut">${x[1]}</div><div class="mut">${rb(x[0]).filter(r=>r.s==='val').length} / ${rb(x[0]).length} rendu(s) validé(s)</div></div>`).join('')}</div><div class="card"><h3>Années de formation (${S.track==='ME'?'2 ans':'3 ans'}, redoublement possible)</h3><div class="grid">${yy().map((x,i)=>`<div class="card" style="margin:0"><b>${x.l}</b><div class="mut">${x.y}-${x.y+1}</div><div class="row" style="margin-top:6px"><button class="g" onclick="addRd(${i})">🔁 Redoublement</button>${x.redo?`<button class="g" onclick="delYr(${i})">Retirer</button>`:''}</div></div>`).join('')}</div><p class="mut">Un redoublement ajoute une année après celle-ci ; les rendus à repasser se marquent « À repasser ».</p></div><div class="row noprint"><button class="g" onclick="expJ()">⬇️ Export JSON</button><button class="g" onclick="document.getElementById('imp').click()">⬆️ Import JSON</button><input id="imp" type="file" accept=".json,application/json" hidden onchange="impJ(this)"><button class="g" onclick="pdf()">📄 PDF (calendrier + blocs)</button><button class="g" onclick="askTrack()">🔄 Changer de parcours</button></div>`};
function expJ(){dlf('eests-planner.json',new Blob([JSON.stringify(S,null,1)],{type:'application/json'}))}
function impJ(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result);if(!o||typeof o!='object'||Array.isArray(o)||(o.track&&!TL[o.track]))throw 0}catch(e){alert('Fichier JSON invalide : import annulé.');return}
if(!confirm('Importer ce fichier remplacera toutes les données actuelles. Continuer ?'))return;S=Object.assign({track:null,r:[],st:[],lib:[],j:[],ev:[]},o);['r','st','lib','j','ev'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!Array.isArray(S.types))S.types=DT;B=null;SY='';sv()};r.readAsText(f)}
async function dlf(n,d){try{const D=window.claude&&await claude.use('downloads');if(D){await D.save({filename:n,data:d});return}}catch(e){if(e&&e.code=='declined')return}
const a=document.createElement('a');a.href=URL.createObjectURL(d instanceof Blob?d:new Blob([d]));a.download=n;a.click()}
function stgPdf(){form('Exporter les stages en PDF',[['an','Année de formation',[['all','Toutes les années'],...yy().map(x=>[x.id,x.l+' ('+x.y+'-'+(x.y+1)+')'])]]],{an:SY},o=>stgPdfGo(o.an),'Exporter')}
function stgPdfGo(an){const Y=yy().filter(x=>an=='all'||x.id==an),th='border:1px solid #999;padding:4px;text-align:left',td='border:1px solid #999;padding:4px;vertical-align:top';let h=`<div class="bl"><h1>EESTS Planner · Structures de stage</h1><p>${TL[S.track]}</p>`;
Y.forEach(x=>{const L=S.st.filter(s=>s.an==x.id);h+=`<h3>${E(x.l)} · ${x.y}-${x.y+1} (${L.length} structure(s) · ${L.filter(s=>s.statut=='ret').length} retenue(s))</h3>`+(L.length?`<table style="width:100%;border-collapse:collapse;font-size:12px"><tr>${['Structure','Type','Mail','Entretien','Réponse','Périodes de stage','Notes'].map(z=>`<th style="${th}">${z}</th>`).join('')}</tr>${L.map(s=>`<tr>${[E(s.nom),E(s.type),E(s.mail),s.entretien?fd(s.entretien):'',E((SS[s.statut||'env']||'').replace(/^\S+\s/,'')),(s.per||[]).map(p=>fd(p.d)+' → '+fd(p.f)).join('<br>'),E(s.notes)].map(z=>`<td style="${td}">${z}</td>`).join('')}</tr>`).join('')}</table>`:'<p>Aucune structure.</p>')});
h+='</div>';document.getElementById('pr').innerHTML=h;document.body.classList.add('pp');onafterprint=()=>document.body.classList.remove('pp');setTimeout(()=>print(),200)}
const STY=['MECS','IME','ITEP','SESSAD','Foyer de vie','FAM / MAS','ESAT','Foyer d\'hébergement','CHRS / CADA','Prévention spécialisée','AEMO','Foyer de l\'enfance'];
const SS={env:'🟡 Candidature envoyée',ent:'🔵 Entretien prévu',ret:'🟢 Retenue',nr:'🔴 Non retenue',pas:'⚪ Pas de réponse'};
const addSt2=id=>{const s=id?S.st.find(x=>x.id==id):null;form(s?'Modifier la structure':'Ajouter une structure',[['an','Année de formation',yy().map(x=>[x.id,x.l+' ('+x.y+'-'+(x.y+1)+')'])],['nom','Nom de la structure'],['type','Type de structure'],['mail','Mail de contact','email'],['entretien','Date d\'entretien','date'],['statut','Réponse',Object.entries(SS)],['notes','Notes','area']],s||{statut:'env',an:SY},o=>{if(s)Object.assign(s,o);else S.st.push({id:uid(),...o,per:[]});sv()})};
const addPer=id=>form('Période de stage',[['d','Début','date'],['f','Fin','date']],{},o=>{if(o.d){S.st.find(x=>x.id==id).per.push(o);sv()}});
const delPer=(id,k)=>{S.st.find(x=>x.id==id).per.splice(k,1);sv()};
const vStg2=()=>{if(!yy().some(x=>x.id==SY))SY=cur().id;const L=S.st.filter(s=>s.an==SY);return `<div class="row sp"><h2>Structures contactées</h2><div class="row"><button class="g" onclick="stgPdf()">📄 Export PDF</button><button class="b" onclick="addSt2()">➕ Ajouter une structure</button></div></div><div class="row" style="margin-bottom:8px">${yy().map(x=>`<button class="${x.id==SY?'b':'g'}" onclick="SY='${x.id}';render()">${E(x.l)}</button>`).join('')}</div><p class="mut">${L.length} contactée(s) · ${L.filter(s=>s.statut=='ret').length} retenue(s). Les entretiens et les périodes de stage s'ajoutent au calendrier.</p>${L.length?L.map(s=>`<div class="card"><div class="row sp"><b>${E(s.nom)}</b><span class="tag">${SS[s.statut||'env']}</span></div><div class="mut">${E(s.type)}${s.mail?` · <a href="mailto:${E(s.mail)}">${E(s.mail)}</a>`:''} · entretien : ${fd(s.entretien)}</div>${s.notes?`<p class="mut">📌 ${E(s.notes)}</p>`:''}${(s.per||[]).map((p,k)=>`<div class="st"><span style="flex:1">Période ${k+1} : ${fd(p.d)} → ${fd(p.f)}</span><button class="g" onclick="delPer('${s.id}',${k})">✕</button></div>`).join('')}<div class="row" style="margin-top:6px"><button class="g" onclick="addPer('${s.id}')">➕ Période de stage</button><button class="g" onclick="addSt2('${s.id}')">Modifier</button><button class="g" onclick="delSt('${s.id}')">Supprimer</button></div></div>`).join(''):'<p class="mut">Aucune structure pour cette année. Ajoutez celles que vous avez contactées.</p>'}`};
function pdf(){const d0=new Date(CD+'T12:00'),sy=d0.getMonth()>=8?d0.getFullYear():d0.getFullYear()-1;form('Exporter en PDF · choisir la période',[['a','Du','date'],['z','Au','date']],{a:sy+'-09-01',z:(sy+1)+'-08-31'},o=>{let a=o.a||sy+'-09-01',z=o.z||(sy+1)+'-08-31';if(z<a)[a,z]=[z,a];pdfGo(a,z)},'Exporter')}
function pdfGo(a,z){const e=evs();
let h=`<div class="bl"><h1>EESTS Planner · ${TL[S.track]}</h1><p>Période : ${fd(a)} → ${fd(z)}</p>`;
bls().forEach(x=>{h+=`<h3>${x[0]} · ${x[1]}</h3>`+(rb(x[0]).filter(r=>{const ds=[r.type!='Oral'?r.date:'',r.type!='Écrit'?r.oral:''].filter(Boolean);return !ds.length||ds.some(d=>d>=a&&d<=z)}).map(r=>`<p><b>${E(r.nom)}</b> · ${yl(r)}${ST[r.s][1]} · ${pr(r)} % · ${E(r.type)}${r.type!='Oral'&&r.date?' · écrit '+fd(r.date):''}${r.type!='Écrit'&&r.oral?' · oral '+fd(r.oral):''}${r.note?' · note '+E(r.note):''}${r.steps.length?'<br>'+r.steps.map(s=>(s.ok?'☑ ':'☐ ')+E(s.t)).join(' · '):''}</p>`).join('')||'<p>Aucun rendu.</p>')});h+='</div>';
const q0=+a.slice(0,4)*12+ +a.slice(5,7)-1,Z=Math.min(q0+47,+z.slice(0,4)*12+ +z.slice(5,7)-1);for(let q=q0;q<=Z;q++){const y=Math.floor(q/12),k=q%12,off=(new Date(y,k,1).getDay()+6)%7,n=new Date(y,k+1,0).getDate();let c='';for(let i=1;i<=n;i++){const ds=`${y}-${String(k+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;c+=`<div class="cell${ds>=a&&ds<=z?'':' o'}"><b>${i}</b>${(ds>=a&&ds<=z?e.filter(x=>x.d===ds):[]).map(x=>`<div class="chip" style="background:${x.c}">${x.h?E(x.h)+' · ':''}${E(x.t)}</div>`).join('')}</div>`}
h+=`<h3 style="text-transform:capitalize">Calendrier · ${new Date(y,k,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h3><div class="cal">${['L','M','M','J','V','S','D'].map(z=>`<div class="h">${z}</div>`).join('')}${'<div></div>'.repeat(off)}${c}</div>`}
document.getElementById('pr').innerHTML=h;document.body.classList.add('pp');onafterprint=()=>document.body.classList.remove('pp');setTimeout(()=>print(),200)}
function render(){if(S.track=='ES'&&S.r.some(x=>/^DC/.test(x.bloc)))S.track='ESd';if(S.track&&!S.yrs)mkY();if(S.track)S.st.forEach(s=>{if(!yy().some(x=>x.id==s.an))s.an=cur().id});S.st.forEach(s=>{if(!s.per){s.per=s.debut?[{d:s.debut,f:s.fin}]:[];s.statut=s.statut||'ret';s.mail=s.mail||s.email||''}});const n=document.getElementById('nav');
if(!S.track){n.innerHTML='';document.getElementById('app').innerHTML=`<div class="card hero" style="margin-top:8vh;text-align:center"><h1>EESTS Planner</h1><p>Pilotez votre formation jusqu'à la diplomation. Choisissez votre parcours.</p><div class="row" style="justify-content:center"><button class="b" style="background:var(--or)" onclick="setTrack('ME')">Moniteur Éducateur (BC1 à BC3)</button><button class="b" onclick="setTrack('ES')">Éducateur Spécialisé · réforme 2026 (BC1 à BC4)</button><button class="g" onclick="setTrack('ESd')" style="color:#fff;border-color:#fff8">Éducateur Spécialisé · ancien référentiel (DC1 à DC4)</button></div></div>`;return}
n.innerHTML=NAV.map(x=>`<button class="${V===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
document.getElementById('app').innerHTML={dash:vDash,bl:vBl,cal:vCal,stg:vStg2,lib:vLib,jr:vJr,dip:vDip}[V]()}
render();
badge();pull();setInterval(pull,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script></body></html>
